name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, Build & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Git whitespace check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "${{ github.event.before }}..HEAD"
          else
            git diff-tree --check --no-commit-id --root -r HEAD
          fi

      - name: Lint changed files (Biome)
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "No base ref to diff against; skipping changed-files lint."
            exit 0
          fi
          pnpm exec biome check --changed --since="$base" --error-on-warnings --no-errors-on-unmatched .

      - name: Verify Drizzle migration journal
        run: pnpm verify:migrations

      - name: Verify DB invariants
        run: pnpm verify:db-invariants

      - name: Typecheck all packages
        run: pnpm typecheck

      - name: Test all packages
        run: pnpm test

      - name: Build all packages
        run: pnpm build

  dependency-security:
    name: Production Dependency Security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Audit production dependency graph
        run: pnpm audit:prod

  playwright:
    name: Playwright Browser Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run public browser smoke tests
        run: pnpm test:e2e:smoke

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  ci:
    name: CI
    if: always()
    needs: [quality, dependency-security, playwright]
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Enforce every verification branch
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          SECURITY_RESULT: ${{ needs.dependency-security.result }}
          PLAYWRIGHT_RESULT: ${{ needs.playwright.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$SECURITY_RESULT" = "success"
          test "$PLAYWRIGHT_RESULT" = "success"
