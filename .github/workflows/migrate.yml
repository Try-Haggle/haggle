name: DB Migrate

# A branch push may touch a shared database only after the complete CI graph
# (quality, dependency security, and Playwright) succeeds for the same SHA.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [staging, main]

concurrency:
  group: migrate-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate (${{ github.event.workflow_run.head_branch }})
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'staging' || github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify migration journal
        run: pnpm verify:migrations

      - name: Enable pgvector extension (staging)
        if: github.event.workflow_run.head_branch == 'staging'
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run migrations (staging)
        if: github.event.workflow_run.head_branch == 'staging'
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: pnpm --filter @haggle/db db:migrate

      - name: Enable pgvector extension (production)
        if: github.event.workflow_run.head_branch == 'main'
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run migrations (production)
        if: github.event.workflow_run.head_branch == 'main'
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: pnpm --filter @haggle/db db:migrate
