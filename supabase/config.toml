# Supabase 로컬 개발 스택 설정 (config.toml)
#
# 역할 분담 (Environment_Separation_Playbook §A2, 결정 D6):
#   - Supabase CLI  = 로컬 인프라(Auth/Storage/Postgres/pgvector)를 Docker로 띄우는 용도만.
#   - Drizzle ORM   = 스키마 마이그레이션의 단일 소스(`packages/db/drizzle/`).
#   → `supabase start`로 빈 DB 기동 후, `make migrate`(= drizzle-kit migrate)로 스키마 적용.
#   → 그래서 [db.migrations] / supabase/migrations 는 비워둠 (CLI 마이그레이션 미사용).
#
# 신규 개발자: `make setup` 한 방 (Makefile이 supabase start → migrate → seed 호출).

project_id = "haggle"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# 클라우드 Supabase와 동일 메이저 버전(Postgres 15)으로 맞춤.
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"

[db.migrations]
# Drizzle을 단일 마이그레이션 소스로 사용 → CLI 자체 마이그레이션 디렉토리는 비활성.
# 스키마는 `make migrate`(drizzle-kit migrate)로 적용한다.
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# 로컬 이메일 테스트용 메일 캐처(Inbucket) — 실제 메일 미발송, UI에서 확인.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

# 코드가 참조하는 버킷들은 `supabase start` 시 자동 생성된다.
# RLS 정책(INSERT/UPDATE)은 supabase/seed.sql이 추가로 박는다.
[storage.buckets.listing-photos]
public = true
file_size_limit = "10MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp"]

[storage.buckets.avatars]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp"]

[auth]
enabled = true
# 로컬 web 앱 기준. OAuth/매직링크 리다이렉트의 기준 URL.
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# 로컬 개발 편의: 이메일 가입/로그인 허용.
enable_signup = true

[auth.email]
enable_signup = true
# 로컬에선 이메일 확인 생략(빠른 개발). 메일은 Inbucket에서 확인 가능.
enable_confirmations = false
double_confirm_changes = true

# Google OAuth (web sign-in/sign-up에서 사용).
# secret은 절대 커밋 금지 → env 참조. 로컬에서 OAuth 쓰려면 .env에 값 채우고 enabled=true.
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = "http://127.0.0.1:54321/auth/v1/callback"

# pgvector: listing_embeddings 등에서 vector(512)/vector(1536) 사용.
# 0002 마이그레이션이 vector 타입을 쓰지만 CREATE EXTENSION을 직접 실행하지 않음(주석만 존재).
# → `make migrate`가 supabase/init-extensions.sql을 db:migrate 전에 먼저 실행해 확장을 보장.
